version: 2

seeds:
  - name: stats19_code_lookup
    description: DfT STATS19 code-to-label lookup, built from the Road Safety Open Data Guide by scripts/build_seeds.py.
    config:
      column_types:
        table_name: varchar
        field_name: varchar
        code: integer
        label: varchar
    columns:
      - name: field_name
        data_tests: [not_null]
      - name: code
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [table_name, field_name, code]