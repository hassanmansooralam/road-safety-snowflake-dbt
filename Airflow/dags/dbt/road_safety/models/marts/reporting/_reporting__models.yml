version: 2

models:
  - name: mart_ksi_by_force_year
    description: KSI casualties by police force and year, recorded and adjusted.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, police_force_code]

  - name: mart_collisions_by_hour
    description: Average collisions per day for each hour of the day, weekdays vs weekends, 2021-2025.
    columns:
      - name: hour_of_day
        data_tests: [unique, not_null]
