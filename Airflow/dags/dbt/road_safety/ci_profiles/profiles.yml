# Used only by GitHub Actions (dbt ... --profiles-dir ci_profiles).
# No secrets here: the key arrives from a GitHub secret at run time.
road_safety:
  target: ci
  outputs:
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: CI_SVC
      private_key_path: "{{ env_var('DBT_PRIVATE_KEY_PATH') }}"
      role: TRANSFORMER
      warehouse: CI_WH
      database: CI
      schema: "{{ env_var('DBT_CI_SCHEMA') }}"
      threads: 4
